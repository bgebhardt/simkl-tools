[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simkl-tools"
version = "0.1.0"
description = "Local CLI/library for working with SIMKL lists via the SIMKL API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
simkl-tools = "simkl_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simkl_tools"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
